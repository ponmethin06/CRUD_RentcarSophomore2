version: '3.8'

services:
  # 1. Web Server (PHP + Apache)
  web:
    build: .
    container_name: rentcar_web
    ports:
      - "8080:80" # เข้าเว็บทาง http://localhost:8080
    volumes:
      - .:/var/www/html # Sync โค้ดสด แก้โค้ดแล้วอัปเดตทันที ไม่ต้อง rebuild
    environment:
      - DB_HOST=db
      - DB_NAME=carrent
      - DB_USER=root
      - DB_PASS=root
    depends_on:
      - db

  # 2. Database Server (MySQL)
  db:
    image: mysql:8.0
    container_name: rentcar_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carrent
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      # เอา db.sql ออกเพื่อไม่ให้สับสนเวลาเริ่มระบบใหม่

  # 3. phpMyAdmin (เครื่องมือจัดการ Database แทน XAMPP phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: rentcar_phpmyadmin
    restart: always
    ports:
      - "8081:80" # เข้า phpMyAdmin ทาง http://localhost:8081
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root